<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Configuración PWA e instalación por defecto como "Vertex" -->
    <title>Vertex</title>
    <meta name="application-name" content="Vertex" />
    <meta name="apple-mobile-web-app-title" content="Vertex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <!-- Sistema cerrado de gestión territorial -->
    <style>
      #static-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #000000 0%, #2E2E2E 50%, #141414 100%);
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #static-splash.hidden-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #static-splash img {
        width: 260px;
        max-width: 75vw;
        max-height: 64px;
        object-fit: contain;
        filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.5));
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen Inicial -->
    <div id="static-splash">
      <img src="/logo-oscuro.svg" alt="VERTEX" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
